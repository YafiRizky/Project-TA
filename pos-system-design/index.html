<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">
    
    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-full mb-4">
                <span class="text-3xl">🏪</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">POS System</h1>
            <p class="text-gray-600">Login ke dashboard Anda</p>
        </div>

        <!-- Role Tabs -->
        <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
            <button 
                id="tabAdmin" 
                onclick="switchTab('admin')" 
                class="flex-1 py-2 px-4 rounded-md font-semibold transition bg-white text-indigo-600 shadow-sm"
            >
                👤 Admin/Owner
            </button>
            <button 
                id="tabKasir" 
                onclick="switchTab('kasir')" 
                class="flex-1 py-2 px-4 rounded-md font-semibold transition text-gray-600"
            >
                💼 Kasir
            </button>
        </div>

        <!-- Admin Login Form -->
        <form id="formAdmin" class="space-y-5" onsubmit="event.preventDefault(); loginAdmin();">
            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input 
                    type="email" 
                    id="adminEmail"
                    placeholder="admin@email.com"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input 
                    type="password" 
                    id="adminPassword"
                    placeholder="••••••••"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                >
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center">
                    <input type="checkbox" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <span class="ml-2 text-gray-700">Ingat saya</span>
                </label>
                <a href="#" class="text-indigo-600 hover:text-indigo-700 font-medium">Lupa password?</a>
            </div>

            <!-- Login Button -->
            <button 
                type="submit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition duration-150"
            >
                Login sebagai Admin
            </button>

            <!-- Demo Info -->
            <div class="mt-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
                <p class="text-xs text-blue-700"><strong>Demo:</strong> admin@demo.com / demo123</p>
            </div>
        </form>

        <!-- Kasir Login Form (Hidden by default) -->
        <form id="formKasir" class="space-y-5 hidden" onsubmit="event.preventDefault(); loginKasir();">
            <!-- Business Code -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Kode Bisnis</label>
                <input 
                    type="text" 
                    id="kasirBusinessCode"
                    placeholder="AB12CD"
                    maxlength="6"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition uppercase font-mono"
                >
                <p class="mt-1 text-xs text-gray-500">6 karakter kode dari admin/owner</p>
            </div>

            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input 
                    type="text" 
                    id="kasirUsername"
                    placeholder="kasir1"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input 
                    type="password" 
                    id="kasirPassword"
                    placeholder="••••••••"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                >
            </div>

            <!-- Login Button -->
            <button 
                type="submit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition duration-150"
            >
                Login sebagai Kasir
            </button>

            <!-- Demo Info -->
            <div class="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg">
                <p class="text-xs text-green-700"><strong>Demo:</strong> AB12CD / kasir1 / kasir123</p>
            </div>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-white text-gray-500">Atau</span>
            </div>
        </div>

        <!-- Register Link -->
        <div class="text-center">
            <p class="text-gray-600">Belum punya akun?
                <a href="register.html" class="text-indigo-600 hover:text-indigo-700 font-semibold">Daftar sekarang</a>
            </p>
        </div>
    </div>

    <script>
        let currentTab = 'admin';

        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            const tabAdmin = document.getElementById('tabAdmin');
            const tabKasir = document.getElementById('tabKasir');
            const formAdmin = document.getElementById('formAdmin');
            const formKasir = document.getElementById('formKasir');
            
            if (tab === 'admin') {
                tabAdmin.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                tabAdmin.classList.remove('text-gray-600');
                tabKasir.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                tabKasir.classList.add('text-gray-600');
                
                formAdmin.classList.remove('hidden');
                formKasir.classList.add('hidden');
            } else {
                tabKasir.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                tabKasir.classList.remove('text-gray-600');
                tabAdmin.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                tabAdmin.classList.add('text-gray-600');
                
                formKasir.classList.remove('hidden');
                formAdmin.classList.add('hidden');
            }
        }

        function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            if (email && password) {
                alert('Login Admin berhasil! Redirecting to admin dashboard...');
                window.location.href = 'admin/dashboard.html';
            }
        }

        function loginKasir() {
            const businessCode = document.getElementById('kasirBusinessCode').value;
            const username = document.getElementById('kasirUsername').value;
            const password = document.getElementById('kasirPassword').value;
            
            if (businessCode && username && password) {
                alert('Login Kasir berhasil! Redirecting to kasir dashboard...');
                window.location.href = 'kasir/dashboard.html';
            }
        }
    </script>
</body>
</html>
